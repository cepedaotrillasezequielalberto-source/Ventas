<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Productos y Ventas al Fío</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 9999px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Encabezado -->
    <header class="bg-indigo-600 text-white shadow-lg sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="p-2 bg-indigo-500 rounded-lg text-white">
                    <i class="fa-solid fa-store text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold leading-tight">Mi Tiendita</h1>
                    <p class="text-xs text-indigo-200">Control de ventas, inventario y cuentas al fío</p>
                </div>
            </div>
            <button id="btnOpenAddModal" onclick="openProductModal()" class="bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white font-medium px-4 py-2.5 rounded-xl shadow transition flex items-center gap-2">
                <i class="fa-solid fa-plus text-sm"></i>
                <span>Nuevo Producto</span>
            </button>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-grow w-full space-y-6">

        <!-- Resumen Estadístico / Tarjetas -->
        <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <!-- Total Productos -->
            <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Total Productos</p>
                    <h3 id="statTotalProducts" class="text-2xl font-bold text-slate-800 mt-1">0</h3>
                </div>
                <div class="w-12 h-12 rounded-xl bg-slate-100 flex items-center justify-center text-slate-600">
                    <i class="fa-solid fa-boxes-stacked text-xl"></i>
                </div>
            </div>

            <!-- Total Cobrado -->
            <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-emerald-600 uppercase tracking-wider">Total Cobrado</p>
                    <h3 id="statTotalRevenue" class="text-2xl font-bold text-emerald-600 mt-1">Bs. 0.00</h3>
                </div>
                <div class="w-12 h-12 rounded-xl bg-emerald-50 flex items-center justify-center text-emerald-600">
                    <i class="fa-solid fa-circle-dollar-to-slot text-xl"></i>
                </div>
            </div>

            <!-- Pendiente por Cobrar (Fiado) -->
            <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-amber-600 uppercase tracking-wider">Pendiente (Al Fío)</p>
                    <h3 id="statTotalPending" class="text-2xl font-bold text-amber-600 mt-1">Bs. 0.00</h3>
                </div>
                <div class="w-12 h-12 rounded-xl bg-amber-50 flex items-center justify-center text-amber-600">
                    <i class="fa-solid fa-hand-holding-dollar te
